# The exact revisions a Lodgiva server image is built from.
#
# setup.sh refuses to build when a ref below no longer points at its SHA, so a
# push never changes what a re-run installs. Third-party apps use release tags,
# which do not move; our own repos use main, so every merge there needs a
# deliberate bump here.
#
# To release: update the SHAs (git ls-remote <repo> <ref>), commit, then
# re-run setup.sh with REBUILD=1. The control app (lodgiva_control) comes from
# this repository at LODGIVA_REF, the same ref setup.sh reads this file from.
FRAPPE_BRANCH=v16.25.0
FRAPPE_SHA=9a8daf343db69a0127f470bad8be0af192cd80c8
FRAPPE_DOCKER_SHA=85ad653360e4670c2e885c4283d293e7b9efeda9
PAYMENTS_REF=v16.0.1
